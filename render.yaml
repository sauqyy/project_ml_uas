# Blueprint deploy Render — MoneyMind (dengan OCR struk)
# Cara pakai: Render Dashboard > New > Blueprint > pilih repo ini.
#
# Catatan penting:
# - Plan "standard" (2GB RAM) DIBUTUHKAN karena easyocr/PyTorch berat. Free/Starter (512MB) akan OOM.
# - Frontend TIDAK di-build di Render; folder backend/static sudah berisi hasil build (di-commit).
#   Jadi buildCommand cukup install Python deps. (Jalankan `npm run build` lokal lalu commit
#   backend/static setiap kali frontend berubah.)
# - torch CPU di-install duluan supaya tidak menarik paket CUDA raksasa.

services:
  - type: web
    name: moneymind
    runtime: python
    plan: standard
    region: singapore
    buildCommand: >-
      pip install --upgrade pip &&
      pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu &&
      pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn main:app --workers 1 --timeout 300 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/categories
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: FLASK_DEBUG
        value: "0"                 # WAJIB 0 di produksi: pakai gunicorn + bot Telegram ikut jalan
      - key: DATABASE_URL
        fromDatabase:
          name: moneymind-db
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN     # opsional — isi di dashboard kalau pakai bot Telegram
        sync: false
      - key: GEMINI_API_KEY         # opsional — isi di dashboard kalau pakai parsing teks Gemini
        sync: false

databases:
  - name: moneymind-db
    plan: basic-256mb              # Postgres berbayar termurah (persisten). Bisa diganti "free" (expire 30 hari).
    region: singapore
