# Blueprint deploy Render — MoneyMind (BOT TELEGRAM only, versi ringan)
#
# Arsitektur: Web + OCR di-host di Hugging Face (yang MEMBLOKIR Telegram),
# sedangkan BOT Telegram di-host di Render (Telegram tidak diblokir). Keduanya
# menunjuk DATABASE_URL Postgres yang SAMA -> data sinkron.
#
# Cara pakai: Render Dashboard > New > Blueprint > pilih repo ini.
# Lalu isi 3 secret (DATABASE_URL, TELEGRAM_BOT_TOKEN, GEMINI_API_KEY) di dashboard.
#
# Catatan:
# - TANPA OCR/torch -> muat di plan FREE (512MB).
# - DATABASE_URL diisi MANUAL (sync:false) dengan External URL Postgres yang sama
#   dengan yang dipakai Space Hugging Face. JANGAN bikin database baru di sini,
#   supaya data tetap satu sumber.
# - Render free "tidur" setelah 15 menit idle; ping URL-nya (mis. cron-job.org)
#   kalau mau bot online 24/7.

services:
  - type: web
    name: moneymind
    runtime: python
    plan: free
    region: singapore
    buildCommand: >-
      pip install --upgrade pip &&
      pip install --no-cache-dir -r backend/requirements-render.txt
    startCommand: cd backend && gunicorn main:app --workers 1 --timeout 300 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/categories
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: FLASK_DEBUG
        value: "0"                 # WAJIB 0: pakai gunicorn + bot Telegram ikut jalan
      # DISABLE_TELEGRAM_BOT sengaja TIDAK diset di sini -> bot AKTIF di Render.
      - key: OCR_REMOTE_URL        # Kirim foto struk ke endpoint OCR di Hugging Face (punya easyocr)
        value: "https://raiarchv-moneymind.hf.space/api/ocr"
      - key: DATABASE_URL          # WAJIB: paste External URL Postgres yang SAMA dengan Hugging Face
        sync: false
      - key: TELEGRAM_BOT_TOKEN    # token bot dari BotFather
        sync: false
      - key: GEMINI_API_KEY        # key parsing teks Gemini
        sync: false
